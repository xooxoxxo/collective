id: tldr-git-difftool-2
title: 'git-difftool: Set the default diff tool to Meld'
cmd: git config --global diff.tool "meld"
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Show file changes using external diff tools. Accepts the same options
  and arguments as `git diff`
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/git-difftool.md
  (CC-BY-4.0)
tags:
- git-difftool
