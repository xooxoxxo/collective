id: tldr-git-range-diff-1
title: 'git-range-diff: Diff the changes of two individual commits'
cmd: git range-diff <commit_1>^! <commit_2>^!
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Compare two commit ranges (e.g. two versions of a branch)
