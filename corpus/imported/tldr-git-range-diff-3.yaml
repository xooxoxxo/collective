id: tldr-git-range-diff-3
title: 'git-range-diff: Diff the changes of two commit ranges, e.g. to check whether
  conflicts have been resolved appropriately when rebasing commits from `base1` to
  `base2`'
cmd: git range-diff <base1>..<rev1> <base2>..<rev2>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Compare two commit ranges (e.g. two versions of a branch)
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/git-range-diff.md
  (CC-BY-4.0)
tags:
- git-range-diff
