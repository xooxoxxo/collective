id: tldr-git-daemon-3
title: 'git-daemon: Launch a Git daemon for the specified directory, verbosely printing
  log messages and allowing Git clients to write to it'
cmd: git daemon <path/to/directory> --enable=receive-pack --informative-errors --verbose
platform:
- macos
domains:
- tldr-import
danger: low
explanation: A really simple server for Git repositories
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/git-daemon.md (CC-BY-4.0)
tags:
- git-daemon
