id: tldr-git-stash-5
title: 'git-stash: Show the changes as a patch between the stash and the commit back
  when stash entry was first created'
cmd: git stash show <[-p|--patch]>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Stash local Git changes in a temporary area
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/git-stash.md (CC-BY-4.0)
tags:
- git-stash
