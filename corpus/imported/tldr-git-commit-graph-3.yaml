id: tldr-git-commit-graph-3
title: 'git-commit-graph: Write a commit-graph file containing all commits in the
  current commit-graph file along with those reachable from `HEAD`'
cmd: git rev-parse <HEAD> | git commit-graph write --stdin-commits --append
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Write and verify Git commit-graph files
