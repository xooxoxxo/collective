id: tldr-git-stamp-1
title: 'git-stamp: Stamp the last commit message referencing it with the issue number
  from your bug tracker'
cmd: git stamp <issue_number>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Stamp the last commit message, with the possibility to reference the
  issues numbers from your bug tracker or link to its review page
