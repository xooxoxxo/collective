id: tldr-git-symbolic-ref-2
title: 'git-symbolic-ref: Store a reference by name, including a message with a reason
  for the update'
cmd: git symbolic-ref -m "<message>" refs/<name> refs/heads/<branch_name>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Read, change, or delete files that store references
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/git-symbolic-ref.md
  (CC-BY-4.0)
tags:
- git-symbolic-ref
