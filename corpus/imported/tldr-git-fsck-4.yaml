id: tldr-git-fsck-4
title: 'git-fsck: Show all unreachable and dangling objects, ignore reflogs, and perform
  a full integrity check'
cmd: git fsck --dangling --no-reflogs --unreachable --full
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Verify the validity and connectivity of nodes in a Git repository index
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/git-fsck.md (CC-BY-4.0)
tags:
- git-fsck
