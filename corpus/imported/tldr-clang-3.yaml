id: tldr-clang-3
title: 'clang: Show common warnings, debug symbols in output, and optimize without
  affecting debugging'
cmd: clang <path/to/source.c> -Wall <[-g|--debug]> -Og <[-o|--output]> <path/to/output_executable>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Compile C, C++, and Objective-C source files. Can be used as a drop-in
  replacement for GCC
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/clang.md (CC-BY-4.0)
tags:
- clang
