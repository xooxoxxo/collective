id: tldr-git-guilt-6
title: 'git-guilt: Find blame delta over the last three weeks (Git 1.8.5+)'
cmd: git guilt @{3.weeks.ago}
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Show total blame count for files with unstaged changes or calculate the
