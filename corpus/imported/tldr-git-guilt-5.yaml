id: tldr-git-guilt-5
title: 'git-guilt: Find blame delta over the last three weeks'
cmd: git guilt 'git log --until "3 weeks ago" --format "%H" <[-n|--max-count]> 1'
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Show total blame count for files with unstaged changes or calculate the
  change in blame between two revisions
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/git-guilt.md (CC-BY-4.0)
tags:
- git-guilt
