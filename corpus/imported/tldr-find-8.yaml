id: tldr-find-8
title: 'find: Search for either empty files or directories and delete them verbosely'
cmd: find <path/to/directory> -type <f|d> -empty -delete -print
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Find files or directories under a directory tree, recursively
