id: tldr-ssh-keygen-7
title: 'ssh-keygen: Change the type of the key format (for example from OPENSSH format
  to PEM), the file will be rewritten in-place'
cmd: ssh-keygen -f <~/.ssh/OpenSSH_private_key> -p -m PEM
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Generate SSH keys used for authentication, password-less logins, and
  other things
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/ssh-keygen.md (CC-BY-4.0)
tags:
- ssh-keygen
