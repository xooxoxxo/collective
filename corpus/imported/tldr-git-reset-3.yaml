id: tldr-git-reset-3
title: 'git-reset: Interactively unstage portions of a file'
cmd: git reset <[-p|--patch]> <path/to/file>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Undo commits or unstage changes by resetting the current Git HEAD to
  the specified state
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/git-reset.md (CC-BY-4.0)
tags:
- git-reset
