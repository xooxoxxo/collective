id: tldr-ssh-keygen-2
title: 'ssh-keygen: Generate an ed25519 key with 32 key derivation function rounds
  and save the key to a specific file'
cmd: ssh-keygen -f <~/.ssh/filename> -t ed25519 -a 32
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Generate SSH keys used for authentication, password-less logins, and
  other things
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/ssh-keygen.md (CC-BY-4.0)
tags:
- ssh-keygen
