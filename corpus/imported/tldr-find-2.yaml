id: tldr-find-2
title: 'find: Find files matching multiple path/name patterns'
cmd: find <path/to/directory> -path '<*/path/*/*.ext>' -or -name '<*pattern*>'
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Find files or directories under a directory tree, recursively
