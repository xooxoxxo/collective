id: tldr-git-cherry-pick-4
title: 'git-cherry-pick: Add the changes of a commit to the working directory, without
  creating a commit'
cmd: git cherry-pick <[-n|--no-commit]> <commit>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Apply the changes introduced by existing commits to the current branch
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/git-cherry-pick.md
  (CC-BY-4.0)
tags:
- git-cherry-pick
