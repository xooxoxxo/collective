id: tldr-git-filter-branch-3
title: 'git-filter-branch: Delete a folder from history'
cmd: git filter-branch --tree-filter 'rm <[-rf|--recursive --force]> <folder>' HEAD
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Change branch history, like removing files
