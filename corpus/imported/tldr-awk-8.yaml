id: tldr-awk-8
title: 'awk: Print table of users with UID >=1000 with header and formatted output,
  using colon as separator (`%-20s` mean: 20 left-align string characters, `%6s` means:
  6 right-align string characters)'
cmd: awk 'BEGIN {FS=":";printf "%-20s %6s %25s\n", "Name", "UID", "Shell"} $4 >= 1000
  {printf "%-20s %6d %25s\n", $1, $4, $7}' /etc/passwd
platform:
- macos
domains:
- tldr-import
danger: low
explanation: A versatile programming language for working on files
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/awk.md (CC-BY-4.0)
tags:
- awk
