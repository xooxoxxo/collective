id: tldr-truncate-1
title: 'truncate: Set a size of 10 GB to an existing file, or create a new file with
  the specified size'
cmd: truncate <[-s|--size]> 10G <path/to/file>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Shrink or extend the size of a file to the specified size
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/truncate.md (CC-BY-4.0)
tags:
- truncate
