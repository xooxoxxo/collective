id: tldr-find-4
title: 'find: Find files matching a given pattern, excluding specific paths'
cmd: find <path/to/directory> -name '<*.py>' -not -path '<*/site-packages/*>'
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Find files or directories under a directory tree, recursively
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/find.md (CC-BY-4.0)
tags:
- find
