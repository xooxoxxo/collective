id: tldr-git-archive-4
title: 'git-archive: Create a `.tar` archive from the contents of the latest commit
  of a specific branch'
cmd: git archive <[-o|--output]> <path/to/file.tar> <branch_name>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Create an archive of files from a tree
