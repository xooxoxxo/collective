id: tldr-sshuttle-4
title: 'sshuttle: Use the tproxy method to forward all IPv4 and IPv6 traffic'
cmd: sshuttle --method tproxy <[-r|--remote]> <username>@<sshserver> <0.0.0.0/0> <::/0>
  <[-x|--exclude]> <your_local_ip_address> <[-x|--exclude]> <ssh_server_ip_address>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Transparent proxy server that tunnels traffic over an SSH connection
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/sshuttle.md (CC-BY-4.0)
tags:
- sshuttle
