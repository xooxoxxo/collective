id: tldr-rsync-4
title: 'rsync: Recursively copy directories and ensure each file is fully committed
  to disk rather than remaining in RAM'
cmd: rsync <[-r|--recursive]> --fsync <path/to/source> <path/to/destination>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Transfer files either to or from a remote host (but not between two remote
