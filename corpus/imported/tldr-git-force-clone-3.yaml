id: tldr-git-force-clone-3
title: 'git-force-clone: Clone a Git repository into an existing directory of a Git
  repository, performing a force-reset to resemble it to the remote and checking out
  a specific branch'
cmd: git force-clone <[-b|--branch]> <branch_name> <remote_repository_location> <path/to/directory>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Get the basic functionality of `git clone`, but if the destination Git
  repository already exists it will force-reset it to resemble a clone of the remote
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/git-force-clone.md
  (CC-BY-4.0)
tags:
- git-force-clone
