id: tldr-launchctl-2
title: 'launchctl: Activate an agent which requires root privileges to run and/or
  should be loaded whenever any user logs in (note the absence of `~` in the path)'
cmd: sudo launchctl load /Library/LaunchAgents/<root_script>.plist
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Control Apple's `launchd` manager for launch daemons (system-wide services)
  and launch agents (per-user programs)
source: https://github.com/tldr-pages/tldr/blob/main/pages/osx/launchctl.md (CC-BY-4.0)
tags:
- launchctl
