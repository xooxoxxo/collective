id: tldr-git-am-2
title: 'git-am: Apply and commit changes following a remote patch file'
cmd: curl <[-L|--location]> <https://example.com/file.patch> | git am
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Apply patch files and create a commit. Useful when receiving commits
  via email
