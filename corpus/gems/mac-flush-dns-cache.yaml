id: mac-flush-dns-cache
title: Flush macOS DNS cache
cmd: sudo dscacheutil -flushcache && sudo killall -HUP mDNSResponder
undo: ""
platform: [macos]
domains: [network, debugging]
danger: low
explanation: >
  Clears the system's DNS resolver cache and resets mDNSResponder. Essential after
  changing /etc/hosts, network configs, or when DNS resolution is stale. Both commands
  are needed on modern macOS (10.13+).
source: https://ss64.com/mac/dscacheutil.html
tags: [dns, network, caching, troubleshooting, localhost]
