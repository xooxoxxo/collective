id: dot-password-on-sleep
title: "Require password immediately when waking from sleep"
cmd: "defaults write com.apple.screensaver askForPassword -int 1 && defaults write com.apple.screensaver askForPasswordDelay -int 0"
undo: "defaults write com.apple.screensaver askForPassword -int 0 && defaults write com.apple.screensaver askForPasswordDelay -int 0"
platform: [macos]
domains: [security, macos-admin]
danger: low
explanation: >
  Locks Mac immediately upon wake without delay, requiring password to unlock.
  Critical security measure for shared/public spaces and nomadic work.
  Prevents unauthorized access during brief unattended moments.
source: "https://github.com/mathiasbynens/dotfiles/blob/main/.macos"
tags: [security, lock, screensaver, password, access-control]
