[package]
name = "collective"
version = "0.3.1"
edition = "2021"
# Two binaries exist (collective, build-pack); name the one `cargo run` means.
default-run = "collective"

[[bin]]
name = "collective"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
include_dir = "0.7"
nucleo-matcher = "0.3"
arboard = "3"
directories = "6"
rand = "0.10"
ratatui = "0.30"
crossterm = "0.29"
ureq = { version = "3", features = ["json"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
