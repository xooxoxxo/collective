[package]
name = "collective"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "collective"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
include_dir = "0.7"
nucleo-matcher = "0.3"
arboard = "3"
directories = "5"
rand = "0.8"
ratatui = "0.28"
crossterm = "0.28"
ureq = { version = "2", features = ["json"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
