id: tldr-sort-6
title: 'sort: As above, but when items in the 3rd field are equal, sort by the 4th
  field by numbers with exponents'
cmd: 'sort <[-t|--field-separator]> : <[-k|--key]> 3,3n <[-k|--key]> 4,4g /etc/passwd'
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Sort lines of text files
