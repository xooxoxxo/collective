id: tldr-git-rev-list-5
title: 'git-rev-list: Print the number of commits since a specific tag'
cmd: git rev-list <tag_name>..HEAD --count
platform:
- macos
domains:
- tldr-import
danger: low
explanation: List revisions (commits) in reverse chronological order
