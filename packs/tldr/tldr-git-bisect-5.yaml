id: tldr-git-bisect-5
title: 'git-bisect: Start a bisect session considering only commits that modify a
  specific file or directory'
cmd: git bisect start <bad_commit> <good_commit> -- <path/to/file_or_directory>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Use binary search to find the commit that introduced a bug
