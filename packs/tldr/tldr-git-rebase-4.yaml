id: tldr-git-rebase-4
title: 'git-rebase: Continue a rebase that was paused due to merge conflicts, by skipping
  the conflicted commit'
cmd: git rebase --skip
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Reapply commits from one branch on top of another branch
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/git-rebase.md (CC-BY-4.0)
tags:
- git-rebase
