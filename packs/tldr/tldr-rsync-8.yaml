id: tldr-rsync-8
title: 'rsync: Transfer a file over SSH using a different port than the default (22)
  and show global progress'
cmd: rsync <[-e|--rsh]> 'ssh -p <port>' --info=progress2 <host>:<path/to/source> <path/to/destination>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Transfer files either to or from a remote host (but not between two remote
  hosts), by default using SSH
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/rsync.md (CC-BY-4.0)
tags:
- rsync
