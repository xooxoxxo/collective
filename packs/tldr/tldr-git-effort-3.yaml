id: tldr-git-effort-3
title: 'git-effort: Display files modified by a specific author, showing commits and
  active days'
cmd: git effort -- --author="<username>"
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Display how much activity a file has had, showing commits per file and
  "active days" i.e. total number of days that contributed to the file
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/git-effort.md (CC-BY-4.0)
tags:
- git-effort
