id: tldr-trivy-2
title: 'trivy: Scan a Docker image filtering the output by severity'
cmd: trivy image <[-s|--severity]> <HIGH,CRITICAL> <alpine:3.15>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Scanner for vulnerabilities in container images, filesystems, and Git
