id: tldr-find-6
title: 'find: Run a command for each file (use `{}` within the command to access the
  filename)'
cmd: find <path/to/directory> -name '<*.ext>' -exec <wc -l> {} \;
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Find files or directories under a directory tree, recursively
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/find.md (CC-BY-4.0)
tags:
- find
