id: tldr-sed-5
title: 'sed: Replace all `apple` (basic `regex`) occurrences with `mango` (basic `regex`)
  in a `file` and save a backup of the original to `file.bak`'
cmd: sed -i bak 's/apple/mango/g' <path/to/file>
