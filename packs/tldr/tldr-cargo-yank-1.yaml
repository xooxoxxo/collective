id: tldr-cargo-yank-1
title: 'cargo-yank: Yank the specified version of a crate'
cmd: cargo yank <crate>@<version>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Remove a pushed crate from the index. This should only be used when you
  accidentally release a significantly broken crate
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/cargo-yank.md (CC-BY-4.0)
tags:
- cargo-yank
