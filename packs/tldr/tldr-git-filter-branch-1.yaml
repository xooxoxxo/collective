id: tldr-git-filter-branch-1
title: 'git-filter-branch: Remove a file from all commits'
cmd: git filter-branch --tree-filter 'rm <[-f|--force]> <file>' HEAD
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Change branch history, like removing files
