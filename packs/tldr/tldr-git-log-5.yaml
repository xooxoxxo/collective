id: tldr-git-log-5
title: 'git-log: Show a graph of all commits, tags, and branches in the entire repo'
cmd: git log --oneline --decorate --all --graph
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Show a history of commits
