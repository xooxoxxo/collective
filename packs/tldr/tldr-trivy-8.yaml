id: tldr-trivy-8
title: 'trivy: Generate output with a SARIF template'
cmd: trivy image <[-f|--format]> <template> <[-t|--template]> "<@sarif.tpl>" <[-o|--output]>
  <path/to/report.sarif> <image:tag>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Scanner for vulnerabilities in container images, filesystems, and Git
  repositories, as well as for configuration issues
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/trivy.md (CC-BY-4.0)
tags:
- trivy
