id: tldr-launchctl-6
title: 'launchctl: Manually run a known (loaded) agent/daemon, even if it is not the
  right time (Note: This command uses the agent''s label, rather than the filename)'
cmd: launchctl start <script_file>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Control Apple's `launchd` manager for launch daemons (system-wide services)
  and launch agents (per-user programs)
source: https://github.com/tldr-pages/tldr/blob/main/pages/osx/launchctl.md (CC-BY-4.0)
tags:
- launchctl
