id: tldr-rsync-3
title: 'rsync: Compress the data as it is sent to the destination, display verbose
  and human-readable progress, and keep partially transferred files if interrupted'
cmd: rsync <[-zvhP|--compress --verbose --human-readable --partial --progress]> <path/to/source>
  <path/to/destination>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Transfer files either to or from a remote host (but not between two remote
  hosts), by default using SSH
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/rsync.md (CC-BY-4.0)
tags:
- rsync
