id: tldr-git-reauthor-1
title: 'git-reauthor: Change an author''s email and name across the whole Git repository'
cmd: git reauthor <[-o|--old-email]> <old@example.com> <[-e|--correct-email]> <new@example.com>
  <[-n|--correct-name]> "<name>"
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Change details about an author identity. Since this command rewrites
  the Git history, `--force` will be needed when pushing next time
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/git-reauthor.md
  (CC-BY-4.0)
tags:
- git-reauthor
