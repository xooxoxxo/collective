id: tldr-git-squash-4
title: 'git-squash: Squash the `n` latest commits and commit concatenating all individual
  messages'
cmd: git squash --squash-msg HEAD~<n>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Squash multiple commits into a single commit
