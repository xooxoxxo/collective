id: tldr-clang-5
title: 'clang: Compile source code into LLVM Intermediate Representation (IR)'
cmd: clang <[-S|--assemble]> -emit-llvm <path/to/source.c> <[-o|--output]> <path/to/output.ll>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Compile C, C++, and Objective-C source files. Can be used as a drop-in
  replacement for GCC
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/clang.md (CC-BY-4.0)
tags:
- clang
