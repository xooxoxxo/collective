id: tldr-git-delete-squashed-branches-1
title: 'git-delete-squashed-branches: Delete all branches that were "squash-merged"
  into the current checked out branch'
cmd: git delete-squashed-branches
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Delete branches that have been "squashed-merged" into a specified branch
  and checkout. If no branch is specified, default to the currently checked out branch
