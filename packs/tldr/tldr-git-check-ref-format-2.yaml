id: tldr-git-check-ref-format-2
title: 'git-check-ref-format: Print the name of the last branch checked out'
cmd: git check-ref-format --branch @{-1}
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Check if a reference name is acceptable, and exit with a non-zero status
  if it is not
