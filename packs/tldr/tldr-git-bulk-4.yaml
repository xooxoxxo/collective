id: tldr-git-bulk-4
title: 'git-bulk: Clone repositories from a newline-separated list of remote locations,
  then register them as workspaces'
cmd: git bulk --addworkspace <workspace_name> /<path/to/root_directory> --from /<path/to/file>
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Execute operations on multiple Git repositories
source: https://github.com/tldr-pages/tldr/blob/main/pages/common/git-bulk.md (CC-BY-4.0)
tags:
- git-bulk
