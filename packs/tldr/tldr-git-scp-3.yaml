id: tldr-git-scp-3
title: 'git-scp: Copy files that has been changed in the last commit and any staged
  or unstaged files to a remote'
cmd: git scp <remote_name> HEAD~1
platform:
- macos
domains:
- tldr-import
danger: low
explanation: Copy files from the current working tree to the working directory of
  a remote repository
